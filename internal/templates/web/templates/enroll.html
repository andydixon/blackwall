<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Enrol Security Key — BlackWall</title>
    <link rel="stylesheet" href="/assets/vendor/tabler/tabler.min.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/blackwall.css">
</head>
<body class="app-page">
<main class="auth-layout d-flex align-items-center justify-content-center py-4">
<div class="auth-panel">
    <div class="card card-md">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <span class="auth-brand"><img src="/assets/blackwall.svg" alt=""></span>
                <h1 class="h2 mb-1">Register Your Security Key</h1>
                <p class="text-secondary small mb-0">Hi {{.UserLabel}}, please register a WebAuthn security key to access your account</p>
            </div>
            {{if .Error}}
            <div class="alert alert-danger">{{.Error}}</div>
            {{end}}
            {{if .Done}}
            <div class="alert alert-success">
                <strong>Key registered!</strong> You can now <a href="/portal/login">sign in to the portal</a>.
            </div>
            {{else}}
            <div id="enroll-status" class="alert alert-info d-none"></div>
            <div class="mb-3">
                <label class="form-label" for="key-label">Key Label (optional)</label>
                <input type="text" class="form-control" id="key-label" placeholder="e.g. YubiKey 5">
            </div>
            <button class="btn btn-primary w-100" id="enroll-btn">Register Security Key</button>
            {{end}}
        </div>
    </div>
</div>
</main>
<script src="/assets/vendor/tabler/tabler.min.js" defer></script>
<script src="/assets/js/blackwall.js"></script>
<script>
const enrollBtn = document.getElementById('enroll-btn');
if (enrollBtn) {
    const options = {{json .Options}};
    enrollBtn.addEventListener('click', async function() {
        const btn = this;
        const status = document.getElementById('enroll-status');
        btn.disabled = true;
        status.className = 'alert alert-info';
        status.textContent = 'Touch your security key…';

        try {
            const credential = await navigator.credentials.create({
                publicKey: {
                    challenge: BlackWall.base64urlDecode(options.challenge),
                    rp: { name: options.rp.name, id: options.rp.id },
                    user: {
                        id: BlackWall.base64urlDecode(options.user.id),
                        name: options.user.name,
                        displayName: options.user.displayName
                    },
                    pubKeyCredParams: options.pubKeyCredParams,
                    timeout: options.timeout,
                    attestation: options.attestation,
                    authenticatorSelection: options.authenticatorSelection
                }
            });

            status.textContent = 'Completing registration…';
            const completeRes = await fetch('/enroll/complete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    token: '{{.Token}}',
                    label: document.getElementById('key-label').value,
                    id: credential.id,
                    response: {
                        clientDataJSON: BlackWall.base64urlEncode(credential.response.clientDataJSON),
                        attestationObject: BlackWall.base64urlEncode(credential.response.attestationObject)
                    }
                })
            });
            const data = await completeRes.json();
            if (data.success) {
                window.location.href = data.redirect || '/portal/login';
            } else {
                throw new Error(data.error || 'Registration failed');
            }
        } catch(err) {
            status.className = 'alert alert-danger';
            status.textContent = err.message;
            btn.disabled = false;
        }
    });
}
</script>
</body>
</html>
