<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — BlackWall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/blackwall.css">
    <style>
        :root {
            --bw-bg: #0b0e14;
            --bw-surface: rgba(22, 27, 34, 0.9);
            --bw-border: #30363d;
            --bw-text: #e1e2ec;
            --bw-text-muted: #9ba3b4;
            --bw-primary: #adc6ff;
            --bw-shadow: 0 20px 40px rgba(0, 0, 0, 0.34);
        }
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at top center, rgba(77, 142, 255, 0.08), transparent 36%),
                linear-gradient(180deg, #0b0e14 0%, #10131a 100%);
            color: var(--bw-text);
            font-family: "Inter", system-ui, sans-serif;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,.35), transparent 80%);
        }
        .login-shell {
            position: relative;
            z-index: 1;
            width: min(980px, calc(100% - 2rem));
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 1.25rem;
            margin: 2rem auto;
        }
        .login-panel,
        .login-card {
            background: var(--bw-surface);
            border: 1px solid var(--bw-border);
            border-radius: 16px;
            box-shadow: var(--bw-shadow);
        }
        .login-panel {
            padding: 2rem;
        }
        .login-panel h1,
        .login-card h5 {
            letter-spacing: -0.03em;
        }
        .login-kicker {
            color: var(--bw-primary);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }
        .login-card {
            padding: 2rem;
        }
        .login-card img {
            height: 40px;
            filter: brightness(0) invert(1);
            opacity: 0.9;
        }
        .login-meta {
            border: 1px solid rgba(140, 144, 159, 0.24);
            border-radius: 12px;
            padding: 1rem;
            background: rgba(255,255,255,0.02);
        }
        .build-info {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }
        .build-info th,
        .build-info td {
            padding: 0.45rem 0;
            border-bottom: 1px solid rgba(140, 144, 159, 0.18);
            vertical-align: top;
        }
        .build-info tr:last-child th,
        .build-info tr:last-child td {
            border-bottom: 0;
        }
        .build-info th {
            width: 8rem;
            color: var(--bw-text-muted);
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .build-info td {
            color: var(--bw-text);
            font-family: "JetBrains Mono", ui-monospace, monospace;
            word-break: break-word;
        }
        @media (max-width: 991.98px) {
            .login-shell {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="login-shell">
    <section class="login-panel">
        <h1 class="display-5 fw-bold mb-3">BlackWall Admin</h1>
        <div class="login-meta">
            <table class="build-info" aria-label="Build information">
                <tr>
                    <th scope="row">Version</th>
                    <td>{{.Version}}</td>
                </tr>
                <tr>
                    <th scope="row">Build date</th>
                    <td>{{.BuildDate}}</td>
                </tr>
            </table>
        </div>
    </section>
    <div class="login-card">
        <div class="text-center mb-4">
            <img src="/assets/blackwall.svg" alt="BlackWall" class="mb-3">
            <h5 class="mb-1 fs-3 fw-bold">Admin Login</h5>
            <p class="text-muted small mb-0">Use your security key to authenticate</p>
        </div>
        {{if .Error}}
        <div class="alert alert-danger">{{.Error}}</div>
        {{end}}
        <div id="webauthn-status" class="alert alert-info d-none"></div>
        <form id="webauthn-form">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" id="csrf_token">
            <button type="submit" class="btn btn-primary w-100" id="signin-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Sign in with Security Key
            </button>
        </form>
        <div class="text-center mt-3">
            <a href="/" class="text-muted small">← Back to home</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/blackwall.js"></script>
<script>
document.getElementById('webauthn-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('signin-btn');
    const status = document.getElementById('webauthn-status');
    btn.disabled = true;
    status.className = 'alert alert-info';
    status.textContent = 'Requesting challenge…';

    try {
        let csrfToken = document.getElementById('csrf_token').value;
        const challengeRes = await fetch('/admin/login/challenge', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'csrf_token=' + encodeURIComponent(csrfToken)
        });
        const challengeData = await challengeRes.json();
        if (!challengeData.challenge) throw new Error(challengeData.error || 'No challenge received');
        if (!challengeData.csrf_token) throw new Error('No CSRF token received');
        csrfToken = challengeData.csrf_token;
        document.getElementById('csrf_token').value = csrfToken;

        status.textContent = 'Please touch your security key…';

        const options = {
            publicKey: {
                challenge: BlackWall.base64urlDecode(challengeData.challenge),
                timeout: 60000,
                rpId: challengeData.rpId || window.location.hostname,
                userVerification: challengeData.userVerification || 'preferred',
                allowCredentials: challengeData.allowCredentials || []
            }
        };

        const assertion = await navigator.credentials.get(options);
        status.textContent = 'Verifying…';

        const verifyRes = await fetch('/admin/login/verify', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                csrf_token: csrfToken,
                id: assertion.id,
                response: {
                    clientDataJSON: BlackWall.base64urlEncode(assertion.response.clientDataJSON),
                    authenticatorData: BlackWall.base64urlEncode(assertion.response.authenticatorData),
                    signature: BlackWall.base64urlEncode(assertion.response.signature)
                }
            })
        });
        const verifyData = await verifyRes.json();
        if (verifyData.success) {
            window.location.href = verifyData.redirect || '/admin';
        } else {
            throw new Error(verifyData.error || 'Authentication failed');
        }
    } catch (err) {
        status.className = 'alert alert-danger';
        status.textContent = err.message || 'Authentication failed';
        btn.disabled = false;
    }
});
</script>
</body>
</html>
