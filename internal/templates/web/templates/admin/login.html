<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Admin Login — BlackWall</title>
    <link rel="stylesheet" href="/assets/vendor/tabler/tabler.min.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/blackwall.css">
</head>
<body class="app-page">
<main class="auth-layout d-flex align-items-center justify-content-center">
<div class="auth-shell">
    <section class="card">
        <div class="card-body p-4">
            <div class="auth-intro__accent"></div>
            <div class="auth-kicker">Control plane</div>
            <h1 class="page-title mt-2">BlackWall Admin</h1>
            <p class="text-secondary">Authenticate with a registered security key to reach the administration interface.</p>
            <table class="build-info mt-4" aria-label="Build information">
                <tr>
                    <th scope="row">Version</th>
                    <td>{{.Version}}</td>
                </tr>
                <tr>
                    <th scope="row">Build date</th>
                    <td>{{.BuildDate}}</td>
                </tr>
            </table>
        </div>
    </section>
    <div class="card card-md">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <span class="auth-brand"><img src="/assets/blackwall.svg" alt=""></span>
                <h2 class="h2 mb-1">Admin Login</h2>
                <p class="text-secondary small mb-0">Use your security key to authenticate</p>
            </div>
            {{if .Error}}
            <div class="alert alert-danger">{{.Error}}</div>
            {{end}}
            <div id="webauthn-status" class="alert alert-info d-none"></div>
            <form id="webauthn-form">
                <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" id="csrf_token">
                <button type="submit" class="btn btn-primary w-100" id="signin-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    Sign in with Security Key
                </button>
            </form>
            <div class="text-center mt-3">
                <a href="/" class="small text-secondary">← Back to home</a>
            </div>
        </div>
    </div>
</div>
</main>
<script src="/assets/vendor/tabler/tabler.min.js" defer></script>
<script src="/assets/js/blackwall.js"></script>
<script>
document.getElementById('webauthn-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('signin-btn');
    const status = document.getElementById('webauthn-status');
    btn.disabled = true;
    status.className = 'alert alert-info';
    status.textContent = 'Requesting challenge…';

    try {
        let csrfToken = document.getElementById('csrf_token').value;
        const challengeRes = await fetch('/admin/login/challenge', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'csrf_token=' + encodeURIComponent(csrfToken)
        });
        const challengeData = await challengeRes.json();
        if (!challengeData.challenge) throw new Error(challengeData.error || 'No challenge received');
        if (!challengeData.csrf_token) throw new Error('No CSRF token received');
        csrfToken = challengeData.csrf_token;
        document.getElementById('csrf_token').value = csrfToken;

        status.textContent = 'Please touch your security key…';

        const options = {
            publicKey: {
                challenge: BlackWall.base64urlDecode(challengeData.challenge),
                timeout: 60000,
                rpId: challengeData.rpId || window.location.hostname,
                userVerification: challengeData.userVerification || 'required',
                allowCredentials: challengeData.allowCredentials || []
            }
        };

        const assertion = await navigator.credentials.get(options);
        status.textContent = 'Verifying…';

        const verifyRes = await fetch('/admin/login/verify', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                csrf_token: csrfToken,
                id: assertion.id,
                response: {
                    clientDataJSON: BlackWall.base64urlEncode(assertion.response.clientDataJSON),
                    authenticatorData: BlackWall.base64urlEncode(assertion.response.authenticatorData),
                    signature: BlackWall.base64urlEncode(assertion.response.signature)
                }
            })
        });
        const verifyData = await verifyRes.json();
        if (verifyData.success) {
            window.location.href = verifyData.redirect || '/admin';
        } else {
            throw new Error(verifyData.error || 'Authentication failed');
        }
    } catch (err) {
        status.className = 'alert alert-danger';
        status.textContent = err.message || 'Authentication failed';
        btn.disabled = false;
    }
});
</script>
</body>
</html>
