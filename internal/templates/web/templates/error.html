<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Error — BlackWall</title>
    <link rel="stylesheet" href="/assets/vendor/tabler/tabler.min.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/blackwall.css">
</head>
<body class="app-page error-page">
<div class="error-wrap px-4">
    <div class="text-center">
        <a class="auth-brand justify-content-center" href="/" aria-label="BlackWall home">
            <img src="/assets/blackwall.svg" alt="">
            <span>BlackWall</span>
        </a>
        <div class="error-code">{{.Code}}</div>
        <div class="error-headline">{{.Title}}</div>
        <div class="error-detail">{{.Message}}</div>
        {{if .TraceCode}}
        <div class="trace-wrap mt-4">
            <p class="text-secondary small mb-2">Error reference:</p>
            <code class="error-trace">{{.TraceCode}}</code>
        </div>
        {{end}}
        <div class="mt-4">
            <a href="/" class="btn btn-primary">Return home</a>
        </div>
    </div>
</div>
</body>
</html>
