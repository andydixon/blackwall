<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — BlackWall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/blackwall.css">
</head>
<body class="bg-charcoal error-page">
<div class="error-wrap px-4">
    <div class="text-center">
        <div class="error-code">{{.Code}}</div>
        <div class="error-headline text-danger">{{.Title}}</div>
        <div class="error-detail text-muted">{{.Message}}</div>
        {{if .TraceCode}}
        <div class="trace-wrap mt-4">
            <p class="text-muted small mb-2">Error reference:</p>
            <code class="error-trace">{{.TraceCode}}</code>
        </div>
        {{end}}
        <div class="mt-4">
            <a href="/" class="btn btn-outline-secondary">Return home</a>
        </div>
    </div>
</div>
</body>
</html>
