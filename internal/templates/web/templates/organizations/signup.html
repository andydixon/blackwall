<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Create Organisation — BlackWall</title>
    <link rel="stylesheet" href="/assets/vendor/tabler/tabler.min.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/blackwall.css">
</head>
<body class="app-page">
<main class="auth-layout d-flex align-items-center justify-content-center py-4">
<div class="auth-panel">
    <div class="card card-md">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <span class="auth-brand"><img src="/assets/blackwall.svg" alt=""></span>
                <h1 class="h2 mb-0">Create Organisation</h1>
            </div>
            {{if .Error}}
            <div class="alert alert-danger">{{.Error}}</div>
            {{end}}
            {{if .Success}}
            <div class="alert alert-success">
                <strong>Organisation created!</strong> An enrollment link has been generated for the admin user. Check with your administrator.
            </div>
            {{else}}
            <form method="POST" action="/organisations/signup">
                <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                <div class="mb-3">
                    <label class="form-label" for="org-name">Organisation Name</label>
                    <input type="text" name="name" id="org-name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="admin-label">Admin User Display Name / Email</label>
                    <input type="text" name="admin_label" id="admin-label" class="form-control" required>
                </div>
                <div class="form-footer">
                    <button type="submit" class="btn btn-primary w-100">Create Organisation</button>
                </div>
            </form>
            {{end}}
        </div>
    </div>
</div>
</main>
<script src="/assets/vendor/tabler/tabler.min.js" defer></script>
</body>
</html>
