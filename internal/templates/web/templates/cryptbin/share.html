<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Share - Cryptbin</title>
    <link rel="stylesheet" href="/assets/vendor/tabler/tabler.min.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/blackwall.css">
</head>
<body class="app-page">
<main class="auth-layout d-flex align-items-center justify-content-center py-4">
    <a class="brand-link auth-layout__brand" href="/" aria-label="BlackWall home">
        <span class="brand-mark brand-mark--logo"><img src="/assets/blackwall.svg" alt=""></span>
        <span class="brand-link__name">BlackWall</span>
    </a>
    <div class="auth-panel">
        <div class="card card-md">
            <div class="card-body p-4 text-center">
                <div class="auth-intro__accent mx-auto"></div>
                <div class="overline">Cryptbin</div>
                <h1 class="h2 mt-2 mb-2">Share Link</h1>
                <p class="text-secondary small">The key fragment is included in the URL hash and never sent to the server.</p>
                <div class="input-group mb-3">
                    <input type="text" class="form-control font-monospace" id="share-url" readonly aria-label="Share URL">
                    <button class="btn btn-outline-primary" id="copy-url-btn" type="button">Copy</button>
                </div>
                <p id="copy-status" class="text-secondary small mb-3">Copy this full URL and send it to the recipient through a secure channel.</p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="#" class="btn btn-primary btn-sm" id="open-item-btn">Open Item</a>
                    <a href="/cryptbin/{{.ID}}" class="btn btn-outline-secondary btn-sm">Back</a>
                </div>
            </div>
        </div>
    </div>
</main>
<script>
window.CRYPTBIN_CONFIG = {
    id: {{json .ID}},
    mode: 'share'
};
</script>
<script src="/assets/vendor/tabler/tabler.min.js" defer></script>
<script src="/assets/js/cryptbin.js"></script>
</body>
</html>
