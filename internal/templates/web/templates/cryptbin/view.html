<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Cryptbin - View</title>
    <link rel="stylesheet" href="/assets/vendor/tabler/tabler.min.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/blackwall.css">
</head>
<body class="app-page">
<header class="navbar navbar-expand-md app-header">
    <div class="container-xl">
        <a class="navbar-brand brand-link" href="/" aria-label="BlackWall home">
            <span class="brand-mark brand-mark--logo"><img src="/assets/blackwall.svg" alt=""></span>
            <span class="brand-link__name">BlackWall</span>
        </a>
        <div class="navbar-nav flex-row order-md-last">
            <a href="/cryptbin" class="btn btn-outline-primary btn-sm">New Item</a>
        </div>
    </div>
</header>

<main>
    <div class="page-heading">
        <div class="container-xl">
            <div class="overline">Encrypted sharing</div>
            <h1 class="page-title">Cryptbin Item</h1>
            <p class="page-intro mt-1 mb-0">ID: <code>{{.ID}}</code></p>
        </div>
    </div>

    <div class="page-body">
        <div class="container-xl">
            <div class="row justify-content-center">
                <div class="col-xl-10">
                    <div id="cryptbin-alert" class="alert d-none" role="alert"></div>

                    <div class="card mb-4">
                        <div class="card-body">
                            <div id="key-warning" class="alert alert-warning d-none mb-3">
                                Missing URL fragment key. Open this page with <code>#&lt;key&gt;</code> to update/delete.
                            </div>
                            <div id="loading-state" class="text-secondary">Loading encrypted content...</div>

                            <div id="text-content-wrapper" class="d-none">
                                <label for="text-content" class="form-label">Decrypted Text</label>
                                <textarea id="text-content" class="form-control" rows="14"></textarea>
                            </div>

                            <div id="file-content-wrapper" class="d-none">
                                <p class="mb-2">Decrypted file is available for download:</p>
                                <button id="download-btn" class="btn btn-success">Download Decrypted File</button>
                                <p class="text-secondary small mt-2 mb-0" id="file-meta"></p>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header"><h2 class="card-title">Actions</h2></div>
                        <div class="card-body">
                            <div class="d-flex flex-wrap gap-2 align-items-center">
                                <button id="update-btn" class="btn btn-primary">Update</button>
                                <input id="update-file-input" class="form-control" type="file" style="max-width: 360px;">
                                <button id="delete-btn" class="btn btn-danger">Delete</button>
                            </div>
                            <p class="text-secondary small mt-3 mb-0">Update/Delete require your key fragment and WebAuthn verification.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
window.CRYPTBIN_CONFIG = {
    csrfToken: {{json .CSRFToken}},
    id: {{json .ID}},
    maxUploadBytes: {{.MaxUploadBytes}},
    maxTextBytes: {{.MaxTextBytes}},
    mode: 'view'
};
</script>
<script src="/assets/vendor/tabler/tabler.min.js"></script>
<script src="/assets/js/cryptbin.js"></script>
</body>
</html>
