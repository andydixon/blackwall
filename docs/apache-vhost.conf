# Apache Virtual Host Configuration for BlackWall
# Location: /etc/apache2/sites-available/blackwall.conf

<VirtualHost *:80>
    ServerName blackwall.cx
    
    # Redirect all HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName blackwall.cx
    ServerAdmin admin@dixon.cx
    
    # Document root points to public_html
    DocumentRoot /home/andy/domains/blackwall.cx/public_html
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /path/to/blackwall.cx/fullchain.pem
    SSLCertificateKeyFile /path/to/blackwall.cx/privkey.pem
    
    # Modern SSL/TLS settings
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off
    
    # Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Content Security Policy
    Header always set Content-Security-Policy "default-src 'self'; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; script-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'none';"
    
    # Directory permissions
    <Directory /home/andy/domains/blackwall.cx/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Enable .htaccess for URL rewriting
        RewriteEngine On
    </Directory>
    
    # Deny access to sensitive directories
    <DirectoryMatch "^/home/andy/domains/blackwall.cx/(src|config|migrations|templates|vendor|bin)">
        Require all denied
    </DirectoryMatch>
    
    # Environment variables (alternative to .env file)
    # Uncomment and set if not using .env
    # SetEnv APP_ENV production
    # SetEnv DB_HOST localhost
    # SetEnv DB_NAME blackwall
    # SetEnv DB_USER blackwall
    # SetEnv DB_PASS "your_password"
    
    # PHP settings (if using mod_php)
    <IfModule mod_php8.c>
        php_value upload_max_filesize 10M
        php_value post_max_size 10M
        php_value memory_limit 256M
        php_value max_execution_time 60
        php_value session.cookie_httponly On
        php_value session.cookie_secure On
        php_value session.cookie_samesite Lax
    </IfModule>
    
    # Logging
    ErrorLog /home/andy/domains/blackwall.cx/logs/apache_error.log
    CustomLog /home/andy/domains/blackwall.cx/logs/apache_access.log combined
    
    # Log level
    LogLevel warn
</VirtualHost>

# Enable the site:
# sudo a2ensite blackwall
# sudo systemctl reload apache2

# Required Apache modules:
# sudo a2enmod rewrite ssl headers
