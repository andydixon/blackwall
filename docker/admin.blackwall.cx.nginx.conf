# admin.blackwall.cx -> the BlackWall admin section on the same container.
#
#     https://admin.blackwall.cx/foo   ->   BlackWall /admin/foo
#
# Install alongside the main site config:
#
#     sudo cp admin.blackwall.cx.nginx.conf \
#             /etc/nginx/sites-available/admin.blackwall.cx.conf
#     sudo ln -s /etc/nginx/sites-available/admin.blackwall.cx.conf \
#                /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# Sibling of blackwall.cx.conf, not a replacement — same upstream, and /admin
# stays reachable on blackwall.cx as before.
#
# ─── IMPORTANT — BlackWall side ──────────────────────────────────────────────
# config.yaml MUST list this hostname in the WebAuthn origin allow-list:
#
#     webauthn_extra_origins: "https://admin.blackwall.cx"
#
# Admin sign-in is a WebAuthn ceremony and the browser stamps the address-bar
# origin into clientDataJSON. Without this the server compares it against
# app_url (https://blackwall.cx), sees admin.blackwall.cx, and fails every
# login with `origin_mismatch`. Credentials themselves are unaffected: they are
# scoped to webauthn_rp_id (blackwall.cx), which is a registrable suffix of
# admin.blackwall.cx, so existing admin passkeys work here with no re-enrolment.
#
# Also keep the usual proxy settings, same as the main vhost:
#     trust_proxy: true
#     trusted_proxies: "127.0.0.1, ::1"
#
# ─── Known consequences ──────────────────────────────────────────────────────
#   * Session cookies are host-only (no Domain attribute), so a sign-in here is
#     a separate session from one on blackwall.cx. Two hostnames, two sessions.
#   * The admin templates emit absolute /admin/... links, so the section answers
#     at BOTH admin.blackwall.cx/dashboard and admin.blackwall.cx/admin/dashboard.
#     The second form is what in-page links, form actions and redirects actually
#     use; the stripped form is for humans typing URLs. Same upstream path.
#   * The admin brand link points at "/", which on this host lands on the
#     dashboard rather than the public landing page.

server {
    listen 80;
    listen [::]:80;
    server_name admin.blackwall.cx;
    # 308 preserves the method, matching the main site's HTTP tier.
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.blackwall.cx;

    # Needs its own certificate — a bare blackwall.cx cert does NOT cover this
    # name. Either issue one, or add admin.blackwall.cx as a SAN on the
    # existing cert and point these at /etc/letsencrypt/live/blackwall.cx/.
    ssl_certificate     /etc/letsencrypt/live/admin.blackwall.cx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.blackwall.cx/privkey.pem;
    include snippets/ssl-params.conf;

    access_log /var/log/nginx/blackwall_admin_access.log;
    error_log  /var/log/nginx/blackwall_admin_error.log warn;

    # Bulk user import is the large-body path on the admin side.
    client_max_body_size 8m;

    # Fallback HSTS only when nginx itself answers (>=400) before proxying.
    # BlackWall emits the authoritative HSTS on normal responses.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Shared proxy settings, hoisted to server level so all three locations
    # below inherit them and only have to declare their proxy_pass.
    include snippets/proxy.conf;
    proxy_read_timeout 120s;

    # Same reasoning as blackwall.cx.conf: signed `blackwall_session` cookies
    # (~1.4 KB, often two per response) plus the security header block overflow
    # nginx's 4 KB default and turn into "upstream sent too big header" 502s.
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;

    # Order matters. nginx picks the longest matching prefix, and ^~ stops it
    # from being second-guessed by any regex location added later.

    # 1. Static assets live at the site root, not under /admin. Prefixing them
    #    would 404 every stylesheet and icon on the page.
    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:8471;
    }

    # 2. Requests already carrying the /admin prefix pass through untouched.
    #    Load-bearing: every link, form action, fetch() and Location header in
    #    the admin UI is an absolute /admin/... path, so without this the first
    #    click after landing would double the prefix and 404.
    location ^~ /admin {
        proxy_pass http://127.0.0.1:8471;
    }

    # 3. Everything else gains the prefix: /foo -> /admin/foo. $request_uri is
    #    the raw original path plus query string, so args survive untouched.
    #    A bare "/" becomes "/admin/", which BlackWall redirects on to
    #    /admin/dashboard.
    location / {
        proxy_pass http://127.0.0.1:8471/admin$request_uri;
    }
}
