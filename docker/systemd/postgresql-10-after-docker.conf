# PostgreSQL's listen_addresses includes 172.17.0.1, the docker0 bridge
# address, so that containers on the default bridge can reach it. That
# interface is created by dockerd, so binding it requires Docker to be up
# first.
#
# Without this ordering the two race at boot. Postgres loses roughly as often
# as it wins, and it fails quietly: it binds localhost, logs "could not bind
# IPv4 address 172.17.0.1: Cannot assign requested address" as a mere WARNING,
# and carries on. systemd reports the unit active and healthy while every
# containerised client is locked out until someone restarts it by hand.
#
# Observed on the 2026-08-17 boot: postgres bound at 10:44:20, docker started
# at 10:46:15, and the cluster ran without its bridge socket for six hours.
[Unit]
After=docker.service
Wants=docker.service
