services:
  blackwall:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/etc/blackwall/config.yaml:ro
      - cryptbin_data:/var/lib/blackwall/cryptbin
    environment:
      - SERVER_ADDR=:8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: blackwall
      POSTGRES_USER: blackwall
      POSTGRES_PASSWORD: blackwallpass
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackwall -d blackwall"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  cryptbin_data:
  db_data:
