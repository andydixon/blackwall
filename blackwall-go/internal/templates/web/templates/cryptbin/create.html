<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptbin — BlackWall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/blackwall.css">
</head>
<body class="bg-charcoal">
<nav class="navbar navbar-dark">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/"><img src="/assets/blackwall.svg" alt="BlackWall" style="height:26px;filter:brightness(0) invert(1);opacity:0.85"> <span>Cryptbin</span></a>
    </div>
</nav>
<main class="container py-4" style="max-width:720px">
    <div class="page-header">
        <h2>Create Encrypted Paste</h2>
    </div>
    {{if .Error}}
    <div class="alert alert-danger">{{.Error}}</div>
    {{end}}
    <div class="card">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">Content</label>
                <textarea class="form-control font-monospace" id="content" rows="12" placeholder="Paste your text here…"></textarea>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Retention (days, 0=forever)</label>
                    <input type="number" class="form-control" id="retention" value="0" min="0">
                </div>
                <div class="col-md-6">
                    <label class="form-label">File Upload</label>
                    <input type="file" class="form-control" id="file-input">
                </div>
            </div>
            <button class="btn btn-primary" id="create-btn">Encrypt &amp; Save</button>
        </div>
    </div>
    <div id="result" class="alert alert-success mt-3 d-none"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/blackwall.js"></script>
<script src="/assets/js/cryptbin.js"></script>
</body>
</html>
