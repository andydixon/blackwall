<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptbin — BlackWall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/blackwall.css">
</head>
<body class="bg-charcoal">
<nav class="navbar navbar-dark">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/cryptbin"><img src="/assets/blackwall.svg" alt="BlackWall" style="height:26px;filter:brightness(0) invert(1);opacity:0.85"> <span>Cryptbin</span></a>
    </div>
</nav>
<main class="container py-4" style="max-width:720px">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Encrypted Paste <code>{{.ID}}</code></span>
            <div class="d-flex gap-2">
                <a href="/cryptbin/{{.ID}}/share" class="btn btn-outline-secondary btn-sm">Share</a>
                <form method="POST" action="/cryptbin/{{.ID}}/delete" onsubmit="return confirm('Delete this paste?')">
                    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Delete</button>
                </form>
            </div>
        </div>
        <div class="card-body">
            <div id="decrypt-status" class="alert alert-info">
                Loading encrypted content…
            </div>
            <pre id="decrypted-content" class="d-none" style="max-height:600px;overflow:auto"></pre>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/blackwall.js"></script>
<script src="/assets/js/cryptbin.js"></script>
<script>
Cryptbin.autoDecrypt('{{.ID}}', '{{.CSRFToken}}');
</script>
</body>
</html>
