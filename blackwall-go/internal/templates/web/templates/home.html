<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackWall Authentication Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/blackwall.css">
</head>
<body class="bg-charcoal d-flex align-items-center justify-content-center" style="min-height:100vh">
<div class="text-center" style="max-width:480px;padding:2rem">
    <img src="/assets/blackwall.svg" alt="BlackWall" style="height:64px;filter:brightness(0) invert(1);opacity:0.85;margin-bottom:2rem">
    <h1 class="h3 mb-2">BlackWall</h1>
    <p class="text-muted mb-4">OAuth 2.1 + OpenID Connect Authorization Server with WebAuthn authentication</p>
    <div class="d-flex gap-2 justify-content-center flex-wrap">
        <a href="/portal/login" class="btn btn-outline-primary">User Portal</a>
        <a href="/admin/login" class="btn btn-outline-secondary">Admin Panel</a>
        <a href="/cryptbin" class="btn btn-outline-secondary">Cryptbin</a>
    </div>
    <div class="mt-4 text-muted small">
        <span class="status-dot online"></span>System operational
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
