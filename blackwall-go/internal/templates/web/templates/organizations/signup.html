<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Organisation — BlackWall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/blackwall.css">
</head>
<body class="bg-charcoal d-flex align-items-center justify-content-center" style="min-height:100vh">
<div class="card" style="width:100%;max-width:500px;margin:2rem auto">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <img src="/assets/blackwall.svg" alt="BlackWall" style="height:40px;filter:brightness(0) invert(1);opacity:0.85;margin-bottom:1rem">
            <h5 class="mb-1">Create Organisation</h5>
        </div>
        {{if .Error}}
        <div class="alert alert-danger">{{.Error}}</div>
        {{end}}
        {{if .Success}}
        <div class="alert alert-success">
            <strong>Organisation created!</strong> An enrollment link has been generated for the admin user. Check with your administrator.
        </div>
        {{else}}
        <form method="POST" action="/organisations/signup">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <div class="mb-3">
                <label class="form-label">Organisation Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Admin User Display Name / Email</label>
                <input type="text" name="admin_label" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Create Organisation</button>
        </form>
        {{end}}
    </div>
</div>
</body>
</html>
