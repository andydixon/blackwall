{{define "content"}}
<div class="row mt-4 g-4">
    <div class="col-lg-3">
        <div class="card sticky-top" style="top: 1rem;">
            <div class="card-header"><h5 class="mb-0">User Guide</h5></div>
            <div class="list-group list-group-flush">
                {{range .DocsPages}}
                <a href="/admin/docs/{{.Slug}}" class="list-group-item list-group-item-action bg-transparent {{if eq .Slug $.CurrentSlug}}active{{else}}text-light{{end}}">
                    <div class="fw-semibold">{{.Title}}</div>
                    <div class="small {{if not (eq .Slug $.CurrentSlug)}}text-muted{{end}}">{{.Summary}}</div>
                </a>
                {{end}}
            </div>
        </div>
    </div>

    <div class="col-lg-9">
        <div class="card mb-3">
            <div class="card-body">
                <h2 class="mb-2">{{.CurrentTitle}}</h2>
                {{if .CurrentSummary}}<p class="text-muted mb-0">{{.CurrentSummary}}</p>{{end}}
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                {{template "doc_body" .}}
            </div>
        </div>

        <div class="d-flex justify-content-between">
            <div>
                {{if .PrevSlug}}<a class="btn btn-outline-light" href="/admin/docs/{{.PrevSlug}}">← {{.PrevTitle}}</a>{{end}}
            </div>
            <div>
                {{if .NextSlug}}<a class="btn btn-outline-light" href="/admin/docs/{{.NextSlug}}">{{.NextTitle}} →</a>{{end}}
            </div>
        </div>
    </div>
</div>
{{end}}
