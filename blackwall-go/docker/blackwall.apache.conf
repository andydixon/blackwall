# Apache 2.4 reverse-proxy configuration for the BlackWall container.
#
# Drop into /etc/apache2/sites-available/blackwall.conf, edit ServerName +
# certificate paths + the Blackwall-side IP allow-list, then:
#
#     sudo a2enmod ssl proxy proxy_http headers rewrite remoteip http2
#     sudo a2ensite blackwall
#     sudo apache2ctl configtest
#     sudo systemctl reload apache2
#
# IMPORTANT — Blackwall side:
#   In config.yaml (or environment) you MUST set:
#       trust_proxy: true
#       trusted_proxies: "127.0.0.1, ::1"     # add any other Apache hosts
#   Without this, Blackwall ignores the X-Forwarded-* headers and:
#     * audit log + rate limiter see "127.0.0.1" for every request
#     * HSTS is not emitted (it only fires when the request is genuinely HTTPS)
#     * the IP-bound CSRF / session protections lose their signal
#
# IMPORTANT — TLS:
#   Blackwall writes Secure cookies. Browsers will refuse them over plain HTTP,
#   so the HTTPS vhost is the production path. The HTTP vhost below is purely
#   a 308 redirect to HTTPS.

# ─── Required modules ─────────────────────────────────────────────────────────
# All of these ship with apache2; enable them with `a2enmod`:
#   ssl proxy proxy_http headers rewrite remoteip http2
# (http2 is optional but recommended for OAuth flow latency.)

# ─── HTTP -> HTTPS redirect ──────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName  auth.example.com
    ServerAdmin webmaster@example.com

    # 308 (Permanent Redirect) preserves the request method, which matters for
    # any OAuth POST that hits the bare HTTP origin by mistake.
    RewriteEngine On
    RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=308,L]

    # Quiet access log noise from the redirect tier.
    ErrorLog  ${APACHE_LOG_DIR}/blackwall_http_error.log
    CustomLog ${APACHE_LOG_DIR}/blackwall_http_access.log combined
</VirtualHost>

# ─── HTTPS reverse proxy ─────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName  auth.example.com
    ServerAdmin webmaster@example.com

    # Use HTTP/2 to upstream-friendly clients. mod_http2 only affects the
    # browser-facing leg; the proxy upstream remains HTTP/1.1 (mod_proxy_http).
    Protocols h2 http/1.1

    # ─── TLS ──────────────────────────────────────────────────────────────
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/auth.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/auth.example.com/privkey.pem
    # Modern Mozilla profile — TLS 1.2+ only, AEAD ciphers preferred.
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder     off
    SSLSessionTickets       off
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384

    # ─── Real client IP (mod_remoteip) ────────────────────────────────────
    # Tell Apache to trust X-Forwarded-For from the local upstream(s) and
    # rewrite REMOTE_ADDR for logging / security modules. This is separate
    # from the BlackWall-side trust_proxy setting; both must be configured.
    RemoteIPHeader          X-Forwarded-For
    # Adjust to match the network Apache itself sits on. Loopback is enough
    # when Apache and the docker host share a kernel.
    RemoteIPInternalProxy   127.0.0.1
    RemoteIPInternalProxy   ::1
    # If Apache is behind a load balancer, append its CIDR here too:
    # RemoteIPInternalProxy 10.0.0.0/8

    # ─── Forwarded headers passed downstream ──────────────────────────────
    # mod_proxy_http sets X-Forwarded-For automatically (appending the real
    # client). We add the rest explicitly because Blackwall reads them.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host  expr=%{HTTP_HOST}
    RequestHeader set X-Forwarded-Port  "443"
    # Generate a correlation ID per request when the client didn't supply one,
    # so Blackwall's audit log can be cross-referenced with Apache logs.
    # The `set if-empty` pattern means an upstream-set header wins.
    RequestHeader setifempty X-Correlation-Id "%{UNIQUE_ID}e"

    # Strip any inbound headers a malicious client might forge to spoof its
    # apparent IP / scheme — we authoritatively set them above.
    RequestHeader unset X-Forwarded-For early
    # (X-Forwarded-For is then re-added by mod_proxy_http using REMOTE_ADDR
    # which mod_remoteip has already corrected, so this is the safe ordering.)

    # ─── The proxy itself ─────────────────────────────────────────────────
    # ProxyPreserveHost is mandatory: Blackwall builds the OIDC `issuer`
    # URL from the request's Host header, so it must see "auth.example.com"
    # rather than "127.0.0.1:8080".
    ProxyPreserveHost   On
    # Don't add a Via: header — keeps internal infrastructure private.
    ProxyVia            Off
    # mod_proxy will retry idempotent requests once on a connection error.
    ProxyTimeout        120

    ProxyPass         "/"  "http://127.0.0.1:8080/"  retry=0  timeout=120
    ProxyPassReverse  "/"  "http://127.0.0.1:8080/"

    # ─── Body size (CryptBin uploads) ─────────────────────────────────────
    # Default cryptbin_max_upload_bytes is 5 MiB; bump LimitRequestBody so
    # a legitimate upload isn't truncated at the Apache layer. Add a safety
    # margin for the multipart envelope.
    LimitRequestBody 8388608   # 8 MiB

    # ─── Security headers ─────────────────────────────────────────────────
    # Blackwall already sets CSP, X-Frame-Options, X-Content-Type-Options,
    # Referrer-Policy, Permissions-Policy, and HSTS (when it sees
    # X-Forwarded-Proto=https). Don't duplicate or override any of these
    # here — the second header would either confuse browsers or weaken the
    # downstream policy. The single thing we add at the edge is HSTS, in
    # case the request didn't reach Blackwall (TLS handshake failures, 4xx
    # served by Apache itself before proxying).
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" "expr=%{REQUEST_STATUS} >= 400"

    # ─── Logs ─────────────────────────────────────────────────────────────
    # Use the "combined" format; mod_remoteip has already replaced %h with
    # the real client IP for downstream logging tools.
    ErrorLog        ${APACHE_LOG_DIR}/blackwall_error.log
    CustomLog       ${APACHE_LOG_DIR}/blackwall_access.log combined
    LogLevel        warn

    # ─── Health check passthrough (optional) ──────────────────────────────
    # If you want an unauthenticated load-balancer probe, expose only the
    # discovery document. (Blackwall doesn't ship a /healthz today.)
    # <Location "/.well-known/openid-configuration">
    #     Require all granted
    # </Location>
</VirtualHost>
